<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Desk</title>
<!-- iPhoneのホーム画面用 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Team Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Android・PC用 -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E8C96">
<style>
  :root { --bg: #f5f5f7; --panel: #fff; --text: #1d1d1f; --sub: #6e6e73; --accent: #0E8C96; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --panel: #2c2c2e; --text: #f5f5f7; --sub: #a1a1a6; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  .card { background: var(--panel); border-radius: 18px; padding: 28px 22px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
  img { width: 84px; height: 84px; border-radius: 19px; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  .sub { color: var(--sub); font-size: 13px; }
  a.btn { display: block; margin: 20px 0 6px; padding: 13px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; }
  ol { text-align: left; padding-left: 22px; margin: 18px 0 0; font-size: 14px; }
  li { margin: 6px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <img src="apple-touch-icon.png" alt="">
  <h1>Team Desk</h1>
  <div class="sub" id="msg">Team Desk を開いています…</div>
  <a class="btn" id="open" href="https://script.google.com/a/macros/onetoone-jp.com/s/AKfycbzcV9SHcIt98eAxcGZzXXMUuFulX42DrPRY-chatCgJnLOoBjlT2416dktLeIrJBQ/exec">Team Desk を開く</a>
  <div id="howto" class="hidden">
    <ol>
      <li>画面下（iPadは上）の <b>共有ボタン</b>（□に↑のマーク）を押す</li>
      <li><b>「ホーム画面に追加」</b>を選ぶ（見当たらないときは、一覧を下へスクロール）</li>
      <li>名前が「Team Desk」になっていることを確認して<b>「追加」</b></li>
    </ol>
    <p class="sub">ホーム画面のアイコンから開くと、Team Desk がすぐ開きます。初回だけ会社の Google アカウントでのログインが必要な場合があります。</p>
  </div>
</div>
<script>
  // Team Desk の本体（会社の Google アカウントでログインした人だけが使えます）
  var TARGET = "https://script.google.com/a/macros/onetoone-jp.com/s/AKfycbzcV9SHcIt98eAxcGZzXXMUuFulX42DrPRY-chatCgJnLOoBjlT2416dktLeIrJBQ/exec";
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var fromHome = window.navigator.standalone === true;
  if (isIOS && !fromHome) {
    // iPhone・iPad の Safari で開いたとき：ホーム画面に追加できるよう、このページにとどまる
    document.getElementById('msg').textContent = 'このページをホーム画面に追加すると、ロゴのアイコンから Team Desk を開けます。';
    document.getElementById('howto').classList.remove('hidden');
  } else {
    // ホーム画面のアイコンから開いたとき・パソコンや Android：すぐに Team Desk へ
    location.replace(TARGET);
  }
</script>
</body>
</html>
